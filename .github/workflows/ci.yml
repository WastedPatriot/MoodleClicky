name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt pytest ruff bandit
      - run: ruff check .
      - run: bandit -q -r moodleclicky
      - run: pytest -q
      - run: xvfb-run -a -s "-screen 0 1600x900x24" python tests/ui_smoke.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -c "import moodleclicky.app, moodleclicky.winutil as w; w.enable_dpi_awareness(); print('import ok')"
