name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb espeak-ng libportaudio2
      - run: pip install -r requirements.txt pytest ruff bandit
      - run: ruff check .
      - run: bandit -q -r moodleclicky
      - run: pytest -q
      - run: xvfb-run -a -s "-screen 0 1600x900x24" python tests/ui_smoke.py
      - run: xvfb-run -a -s "-screen 0 1600x900x24" python -m moodleclicky --selftest

  linux-install:
    # The real Linux install path (Parrot / Kali / Debian / Ubuntu): install.sh from this checkout with scripted
    # answers, the installed app's self-test, launch, then uninstall.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install with scripted answers (custom / Ollama provider)
        env:
          MC_STDIN: "1"
          XDG_SESSION_TYPE: x11
        run: |
          printf '3\n\n\n\nCI\nTest course\n1\n1\nn\ny\ny\n1\n' > answers.txt
          cd /tmp && xvfb-run -a -s "-screen 0 1366x768x24" bash "$GITHUB_WORKSPACE/install.sh" --from "$GITHUB_WORKSPACE" --yes < "$GITHUB_WORKSPACE/answers.txt"
      - name: Check saved settings
        run: |
          python3 - <<'PY'
          import json, os
          c = json.load(open(os.path.expanduser("~/.config/moodleclicky/config.json")))
          want = {"provider": "custom", "custom_url": "http://localhost:11434/v1", "your_name": "CI",
                  "trigger": "double_ctrl", "effort": "low", "whisper_model": "tiny.en"}
          bad = {k: c.get(k) for k in want if c.get(k) != want[k]}
          assert not bad, bad
          print("settings OK")
          PY
      - name: Installed app self-test (real key events on X11)
        run: cd /tmp && xvfb-run -a -s "-screen 0 1600x900x24" ~/.local/bin/moodleclicky --selftest
      - name: Launch stays running, then uninstall
        run: |
          cd /tmp
          xvfb-run -a -s "-screen 0 1366x768x24" bash -c '~/.local/bin/moodleclicky; sleep 12; pgrep -f "venv/bin/python -m moodleclicky"'
          printf 'n\n' | MC_STDIN=1 ~/.local/bin/moodleclicky --uninstall
          test ! -e ~/.local/share/moodleclicky && test ! -e ~/.local/bin/moodleclicky && echo "uninstalled"

  windows:
    needs: [linux, linux-install]  # a release is only published if every platform passes
    runs-on: windows-latest
    permissions:
      contents: write  # publish Releases on v* tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        env:
          MC_SKIP_WHISPER: "1"
        run: pytest -q
      - name: Self-test from source (real windows, real screenshot)
        timeout-minutes: 6
        run: python -m moodleclicky --selftest
      - name: Build MoodleClicky.exe + self-test the build
        timeout-minutes: 25
        shell: pwsh
        run: ./tools/build_windows.ps1
      - name: Installer test (install from the built zip, setup menu, launch, uninstall)
        timeout-minutes: 8
        shell: pwsh
        run: |
          "1`nsk-ant-ci-not-a-real-key`nCI`nTest course`n1`n1`nn`ny`ny`n1`n" | pwsh -NoProfile -File install.ps1 -Zip dist/MoodleClicky-windows.zip
          $dir = Join-Path $env:LOCALAPPDATA "Programs\MoodleClicky"
          if (-not (Test-Path "$dir\MoodleClicky.exe")) { throw "exe not installed" }
          foreach ($l in "MoodleClicky.lnk", "MoodleClicky Setup.lnk", "Uninstall MoodleClicky.lnk") {
            if (-not (Test-Path (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\$l"))) { throw "missing shortcut $l" }
          }
          Get-Content (Join-Path $env:APPDATA "MoodleClicky\setup.log")
          $cfg = Get-Content (Join-Path $env:APPDATA "MoodleClicky\config.json") -Raw | ConvertFrom-Json
          if ($cfg.your_name -ne "CI" -or $cfg.whisper_model -ne "tiny.en" -or $cfg.trigger -ne "double_ctrl" -or $cfg.effort -ne "low") { throw "setup answers not saved" }
          Start-Sleep -Seconds 8
          if (-not (Get-Process MoodleClicky -ErrorAction SilentlyContinue)) {
            Get-Content (Join-Path $env:APPDATA "MoodleClicky\moodleclicky.log") -ErrorAction SilentlyContinue
            throw "installed app didn't stay running"
          }
          Write-Host "Installed app is running."
          "y`n`n" | pwsh -NoProfile -File install.ps1 -Uninstall
          Start-Sleep -Seconds 5
          if (Test-Path $dir) { throw "app folder not removed" }
          if (Test-Path (Join-Path $env:APPDATA "MoodleClicky")) { throw "data not removed" }
          Write-Host "Install / setup / launch / uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: MoodleClicky-windows
          path: dist/MoodleClicky-windows.zip
      - name: Remove releases whose tags aren't on main (after a history rewrite)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force origin
          foreach ($tag in (git tag --list "v*")) {
            git merge-base --is-ancestor $tag origin/main
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Removing release + tag $tag (not on main any more)"
              gh release delete $tag --yes --cleanup-tag 2>$null
              if ($LASTEXITCODE -ne 0) { git push origin ":refs/tags/$tag" }
            }
          }
          $global:LASTEXITCODE = 0
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import moodleclicky; print(moodleclicky.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          python tools/release_notes.py $v dist/release_notes.md
      - name: Publish release (main branch and v* tags) - this is what install.ps1 downloads
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MoodleClicky ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: dist/release_notes.md
          files: dist/MoodleClicky-windows.zip
