[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodleclicky"
version = "0.1.0"
description = "A desktop cursor study buddy: press a hotkey, it looks at your screen and walks you through the answer step by step."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.12",
    "mss>=9",
    "pillow>=10",
    "pynput>=1.7",
    "pystray>=0.19",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7"]

[project.gui-scripts]
moodleclicky = "moodleclicky.app:main"

[tool.setuptools]
packages = ["moodleclicky"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["moodleclicky", "fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
